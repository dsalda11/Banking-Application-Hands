spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
server.port=${SERVER_PORT:8080}
logging.level.org.springframework.web=${LOGGING_LEVEL_SPRING_WEB:INFO}

#Database Configuration

#provide jdbc url for the database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/database?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
#provide username and password
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bankapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bankapp_local}
#provide driver class name , here we are using mysql database
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
app.mail.enabled=${APP_MAIL_ENABLED:false}

# Other properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# TLS , port 587
spring.mail.properties.mail.smtp.starttls.enable=true
